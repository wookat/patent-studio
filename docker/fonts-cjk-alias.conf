<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Patent Studio 字体策略（LibreOffice 转 PDF 时生效；DOCX 内写入的字体名不变，零漂移不受影响）：

  1. 首选用户自装的授权字体：仓库不分发宋体/黑体等受限字体；用户可将持有授权的字体放入
     ~/.fonts 或系统字体目录，字体存在时本文件的别名不起作用（用 <accept> 而非 <prefer>）。
  2. 缺真实字体时的开源替身（度量接近，实测两案页数 22/15 页，与真实字体相同）：
       宋体 / SimSun / 仿宋 / 楷体 -> AR PL UMing CN      (fonts-arphic-uming, 行高 1.05 em)
       黑体 / SimHei              -> WenQuanYi Micro Hei (fonts-wqy-microhei, 行高 1.17 em)
       Times New Roman            -> Liberation Serif（度量兼容）
       Courier New                -> Liberation Mono（度量兼容）
       Cambria Math               -> Liberation Serif（公式文本；符号由 libreoffice-math 的 OpenSymbol 兜底）
  3. Noto Serif/Sans CJK 只做最后兜底：其 hhea 行高 1.44 em，LibreOffice 的"1.3 倍行距"按字体行高倍乘，
     用 Noto 当正文会把方法案从 22 页撑到 36 页（本机实测），因此不作首选替身。
-->
<fontconfig>
  <alias><family>宋体</family><accept><family>SimSun</family><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>SimSun</family><accept><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>仿宋</family><accept><family>SimSun</family><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>仿宋_GB2312</family><accept><family>SimSun</family><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>楷体</family><accept><family>SimSun</family><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></accept></alias>
  <alias><family>黑体</family><accept><family>SimHei</family><family>WenQuanYi Micro Hei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>SimHei</family><accept><family>WenQuanYi Micro Hei</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>Cambria Math</family><accept><family>Liberation Serif</family></accept></alias>
  <alias><family>Cambria</family><accept><family>Liberation Serif</family></accept></alias>
</fontconfig>
