[alembic]
script_location = patent_studio.infra.db:migrations
file_template = %%(rev)s_%%(slug)s
# 数据库地址不写在这里：读 PATENT_STUDIO_DATABASE_URL，或 alembic -x 覆盖 sqlalchemy.url

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
