[project]
name = "patent-studio-backend"
version = "0.1.0"
description = "Patent Studio — CN 发明专利申请文件所见即所得编辑器（FastAPI 后端 + patent_docx 排版内核）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-docx==1.2.0",
    "lxml>=5,<7",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<6",
    "rapidocr-onnxruntime>=1.3,<2",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8,<4",
    "pillow>=10,<13",
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "aiosqlite>=0.22.1,<0.23",
    "httpx>=0.27,<1",
    "mcp>=2.1.1,<3",
    "pycrdt>=0.14.4,<0.15",
    "pycrdt-websocket>=0.16.4,<0.17",
    "pdfplumber>=0.11,<1",
    "latex2mathml>=3.77,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4.23,<5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["patent_docx/omml.py", "patent_docx/content.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B011", "B904", "B905", "UP009", "UP031", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
